[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-cleaner-kit"
version = "1.0.0"
description = "📱 手机相册缩略图与重复图片对比清理工程化工具包 (Mobile Photo Cleanup Kit)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Antigravity Agent" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Utilities"
]

[project.scripts]
phone-cleaner = "phone_cleaner.cli:main"
cleaner = "phone_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phone_cleaner*"]

[tool.setuptools.package-data]
"phone_cleaner.server.static" = ["*.html", "*.js", "*.css"]
